<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEFL C1 Trainer</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#e5e7eb; --muted:#94a3b8; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  main { max-width:420px; text-align:center; }
  .logo { width:56px; height:56px; border-radius:14px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; margin:0 auto 16px; }
  p { color:var(--muted); line-height:1.5; }
  a { color:var(--accent); }
  .spin { width:22px; height:22px; border:3px solid #cbd5e1; border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; margin:16px auto; }
  @keyframes s { to { transform:rotate(360deg) } }
</style>
</head>
<body>
<main>
  <div class="logo">C1</div>
  <h1 style="font-size:1.3rem;margin:0">TOEFL C1 Trainer</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Conectando con el servidor…</p>
</main>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const key = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const sources = [
    'https://api.github.com/repos/GallardoCC/toefl-link/contents/url.txt?ref=main',
    'url.txt?t=' + Date.now(),
  ];
  let url = '';
  for (const s of sources) {
    try {
      const r = await fetch(s, { cache: 'no-store', headers: s.includes('api.github') ? { Accept: 'application/vnd.github.raw' } : {} });
      if (r.ok) { url = (await r.text()).trim(); if (/^https:\/\/[a-z0-9.-]+$/.test(url)) break; url = ''; }
    } catch (e) {}
  }
  if (!url) { document.getElementById('spin').remove(); msg.textContent = 'No se encontró el servidor. ¿La PC está encendida? Intenta en un minuto.'; return; }
  location.replace(url + '/' + (key ? '?k=' + encodeURIComponent(key) : ''));
})();
</script>
</body>
</html>
